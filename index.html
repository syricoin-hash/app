<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyriCoin Premium App</title>
    <script src="https://telegram.org"></script>
    <script src="https://adsgram.ai"></script>
    <style>
        /* نظام ألوان وهندسة أبل المطفية المتميزة */
        :root {
            --apple-bg: #000000;
            --apple-card: #1c1c1e;
            --apple-card-secondary: #2c2c2e;
            --apple-text: #f5f5f7;
            --apple-text-muted: #86868b;
            --apple-blue: #0071e3;
            --apple-green: #30d158;
            --apple-purple: #bf5af2;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body { 
            background-color: var(--apple-bg); 
            color: var(--apple-text); 
            padding: 16px; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* حاوية علوية تشبه الجزيرة الديناميكية لأبل Dynamic Island */
        .dynamic-header {
            background: var(--apple-card);
            border-radius: 24px;
            padding: 24px 16px;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--apple-text-muted);
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .balance-label {
            font-size: 14px;
            color: var(--apple-text-muted);
            font-weight: 400;
            letter-spacing: -0.2px;
        }

        .balance-amount {
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 4px;
            letter-spacing: -1px;
        }

        .currency {
            font-size: 20px;
            font-weight: 400;
            color: var(--apple-text-muted);
            margin-right: 4px;
        }

        /* شبكة تقسيم كروت أبل الفخمة Bento Grid Layout */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        /* تصميم الكبس الكاش الواسع أسفل الشبكة */
        .full-width-box {
            grid-column: span 2;
        }

        /* هندسة بطاقات أبل التفاعلية */
        .apple-card-btn {
            background: var(--apple-card);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            text-align: right;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .apple-card-btn:active {
            transform: scale(0.97);
            background: var(--apple-card-secondary);
        }

        /* أيقونات ناعمة وراقية */
        .card-icon {
            font-size: 22px;
            background: rgba(255, 255, 255, 0.05);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .icon-video { color: var(--apple-purple); }
        .icon-tasks { color: var(--apple-blue); }
        .icon-channel { color: #5ac8fa; }
        .icon-invite { color: #ff9500; }
        .icon-withdraw { color: var(--apple-green); }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--apple-text);
            line-height: 1.3;
        }

        .card-desc {
            font-size: 12px;
            color: var(--apple-text-muted);
            margin-top: 4px;
            font-weight: 400;
        }

        /* كرت السحب النقدي الممتد المتميز */
        .withdraw-row {
            flex-direction: row !important;
            align-items: center !important;
            min-height: auto !important;
            padding: 16px !important;
            background: linear-gradient(135deg, #1c1c1e 0%, #111112 100%);
            border: 1px solid rgba(48, 209, 88, 0.15);
        }

        .withdraw-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .withdraw-row .card-icon {
            margin-bottom: 0 !important;
            margin-left: 14px;
            background: rgba(48, 209, 88, 0.1);
        }

        /* فوتر حقوق أبل سفلي خفيف */
        .apple-footer {
            margin-top: auto;
            font-size: 11px;
            color: var(--apple-text-muted);
            text-align: center;
            padding: 16px 0;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

    <!-- الواجهة العلوية الفخمة -->
    <div class="dynamic-header">
        <div id="username" class="user-badge">جاري المزامنة مع سحابة SyriCoin...</div>
        <div class="balance-label">الرصيد المتوفر والمستحق نقدًا</div>
        <div class="balance-amount"><span id="balance">0</span><span class="currency"> ل.س</span></div>
    </div>

    <!-- شبكة عروض بينتو الاحترافية Bento Grid -->
    <div class="bento-grid">
        
        <!-- كرت تشغيل الفيديو اليومي -->
        <div class="apple-card-btn" onclick="showVideoAd()">
            <div class="card-icon icon-video">✦</div>
            <div>
                <div class="card-title">مكافأة الفيديو</div>
                <div class="card-desc">+500 ليرة فورًا</div>
            </div>
        </div>

        <!-- كرت المهام الماسية -->
        <div class="apple-card-btn" onclick="openCpaTasks()">
            <div class="card-icon icon-tasks">📊</div>
            <div>
                <div class="card-title">المهام الماسية</div>
                <div class="card-descأرباح مضخمة</div>
            </div>
        </div>

        <!-- كرت الانضمام للقناة -->
        <div class="apple-card-btn" onclick="openChannel()">
            <div class="card-icon icon-channel">📢</div>
            <div>
                <div class="card-title">القناة الرسمية</div>
                <div class="card-desc">متابعة التحديثات</div>
            </div>
        </div>

        <!-- كرت دعوة الأصدقاء -->
        <div class="apple-card-btn" onclick="inviteFriends()">
            <div class="card-icon icon-invite">👥</div>
            <div>
                <div class="card-title">دعوة الأصدقاء</div>
                <div class="card-desc">نظام الإحالة الذكي</div>
            </div>
        </div>

        <!-- كرت السحب النقدي الممتد الفاخر -->
        <div class="apple-card-btn full-width-box withdraw-row" onclick="requestWithdraw()">
            <div class="card-icon icon-withdraw">💳</div>
            <div class="withdraw-text-group">
                <div class="card-title">طلب سحب الأرباح كاش</div>
                <div class="card-desc">تحويل فوري وآمن لمحفظتك النقذية الشخصية</div>
            </div>
        </div>

    </div>

    <div class="apple-footer">Designed by SyriCoin Team © 2026</div>

    <script>
        // دمج برمجيات تليجرام وأتمتة الأرباح
        const tg = window.Telegram.WebApp; 
        tg.expand();
        tg.ready();

        const MAKE_WEBHOOK_URL = "https://make.com"; 
        const CPALEAD_OFFER_WALL = "https://cpalead.com"; 
        const BOT_USERNAME = "SyricoinTask_bot";
        const CHANNEL_LINK = "https://t.me"; 

        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : "guest";
        const firstName = user ? user.first_name : "مستخدم SyriCoin";
        
        document.getElementById('username').innerText = user ? `👤 الحساب الموثق: ${firstName}` : "👤 SyriCoin Secure Mode";

        async function fetchUserBalance() {
            if (userId === "guest") return;
            try {
                const response = await fetch(`${MAKE_WEBHOOK_URL}?action=getBalance&userId=${userId}&name=${encodeURIComponent(firstName)}`);
                const data = await response.json();
                if (data && data.balance !== undefined) {
                    document.getElementById('balance').innerText = parseInt(data.balance).toLocaleString('ar-SY');
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function addEarnings(amount, reason) {
            document.getElementById('balance').innerText = "...";
            try {
                const response = await fetch(`${MAKE_WEBHOOK_URL}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: "addBalance",
                        userId: userId,
                        name: firstName,
                        amount: amount,
                        reason: reason
                    })
                });
                const data = await response.json();
                if (data && data.newBalance !== undefined) {
                    document.getElementById('balance').innerText = parseInt(data.newBalance).toLocaleString('ar-SY');
                    return true;
                }
            } catch (error) {
