<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق SyriCoin - المنصة المالية الرقمية</title>
    <!-- استيراد خط Tajawal لتصميم مالي احترافي -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الجزء العلوي (الشريط الاحترافي) -->
    <header class="main-header">
        <div class="logo">Syri<span>Coin</span></div>
        <div class="status-badge">متصل</div>
    </header>

    <!-- المحتوى الرئيسي المتغير -->
    <main class="app-container">
        
        <!-- صفحة الرصيد الرئيسية (Home / Wallet View) -->
        <section id="home-view" class="app-screen active">
            <!-- بطاقة الرصيد الفاخرة الكبيرة -->
            <div class="balance-card">
                <span class="card-label">إجمالي الرصيد المتاح</span>
                <h1 class="card-amount">1,250,500 <span class="currency">SC</span></h1>
                <div class="card-stats">
                    <div class="stat-item">
                        <span class="stat-label">الأرباح اليومية</span>
                        <span class="stat-value profit">+2.4%</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">الإحالات</span>
                        <span class="stat-value">48 مستخدم</span>
                    </div>
                </div>
            </div>

            <!-- أزرار الإجراءات السريعة بوهج نيون (CTA) -->
            <div class="action-buttons">
                <button class="btn btn-primary btn-glow">إيداع سريع</button>
                <button class="btn btn-secondary">سحب الأرباح</button>
            </div>
        </section>

        <!-- صفحة المهام (Tasks View - مخفية افتراضياً للتنقل) -->
        <section id="tasks-view" class="app-screen">
            <h2 class="section-title">المهام اليومية</h2>
            <div class="glass-card task-item">
                <div class="task-info">
                    <h3>متابعة قنوات التواصل</h3>
                    <p>احصل على عملات فورية</p>
                </div>
                <button class="btn btn-sm btn-glow">+50 SC</button>
            </div>
        </section>

        <!-- بقية الصفحات (Wallet, Invite, Profile) تتبع نفس بنية القوالب الزجاجية -->
    </main>

    <!-- شريط التنقل السفلي السلس (Bottom Navigation Bar) -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="home-view">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">الرئيسية</span>
        </button>
        <button class="nav-item" data-target="tasks-view">
            <span class="nav-icon">🎯</span>
            <span class="nav-text">المهام</span>
        </button>
        <button class="nav-item" data-target="wallet-view">
            <span class="nav-icon">💼</span>
            <span class="nav-text">المحفظة</span>
        </button>
        <button class="nav-item" data-target="invite-view">
            <span class="nav-icon">👥</span>
            <span class="nav-text">دعوة</span>
        </button>
        <button class="nav-item" data-target="profile-view">
            <span class="nav-icon">👤</span>
            <span class="nav-text">الحساب</span>
        </button>
    </nav>

    <!-- نص برمي بسيط لتفعيل التنقل السلس بين الشاشات واختبار الواجهة -->
    <script>
        document.querySelectorAll('.nav-item').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.app-screen').forEach(screen => screen.classList.remove('active'));
                
                button.classList.add('active');
                const target = button.getAttribute('data-target');
                const activeScreen = document.getElementById(target);
                if (activeScreen) activeScreen.classList.add('active');
            });
        });
    </script>
</body>
</html>
